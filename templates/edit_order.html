<!DOCTYPE html>
<html>

<head>
    <title>Edit Order</title>
</head>

<body>

<h1>Edit Order</h1>

<form method="POST">

    <label>Customer Name:</label><br>
    <input type="text" name="customer_name"
           value="{{ order['customer_name'] }}" required>

    <br><br>

    <label>Product Name:</label><br>
    <input type="text" name="product_name"
           value="{{ order['product_name'] }}" required>

    <br><br>

    <label>Quantity:</label><br>
    <input type="number" name="quantity"
           value="{{ order['quantity'] }}" required>

    <br><br>

    <label>Total Price:</label><br>
    <input type="number" name="total_price"
           value="{{ order['total_price'] }}" step="0.01" required>

    <br><br>

    <label>Status:</label><br>

    <select name="status">
        <option value="Pending"
        {% if order['status'] == 'Pending' %}selected{% endif %}>
            Pending
        </option>

        <option value="Processing"
        {% if order['status'] == 'Processing' %}selected{% endif %}>
            Processing
        </option>

        <option value="Shipped"
        {% if order['status'] == 'Shipped' %}selected{% endif %}>
            Shipped
        </option>

        <option value="Delivered"
        {% if order['status'] == 'Delivered' %}selected{% endif %}>
            Delivered
        </option>
    </select>

    <br><br>

    <button type="submit">Update Order</button>

</form>

<br>

<a href="/orders">← Back to Orders</a>

</body>

</html>
